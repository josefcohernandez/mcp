# DevFest MCP server for a Linux VM that already has an HTTPS reverse proxy.
# Run from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
services:
  devfest-mcp:
    build:
      context: ..
      dockerfile: workshop/05-bonus-home/Dockerfile
    image: devfest-mcp:latest
    container_name: devfest-mcp
    restart: unless-stopped
    # Only reachable from the VM itself; the reverse proxy terminates HTTPS on 443.
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
